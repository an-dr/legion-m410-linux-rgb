[workspace]
resolver = "2"
members = ["extension", "checks", "app", "crates/m410", "crates/messages", "crates/panel"]
# `cargo test` runs the native checks; the extension builds for wasm32-wasip2
# through `bones-develop build`.
default-members = ["checks", "app", "crates/m410", "crates/messages", "crates/panel"]

[profile.release]
# Smaller components load faster and hot-reload sooner.
opt-level = "s"
