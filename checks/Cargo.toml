[package]
name = "legion-m410-linux-rgb-checks"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
bones-test = { git = "https://github.com/an-dr/bones", tag = "v4.0.0" }
# The native module under test, and the vocabulary it speaks. `bones-messages`
# is named here for the traits `m410-messages` is written against: bones-test
# re-exports the engine's copy of the crate, which cargo keeps separate.
legion-m410-linux-rgb-app = { path = "../app" }
m410-messages = { path = "../crates/messages" }
bones-messages = { git = "https://github.com/an-dr/bones", tag = "abi-v1.4.0" }
m410-panel = { path = "../crates/panel" }
